services:
  - type: web
    name: blastradius-backend
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build:server
    startCommand: pnpm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
        # Set this in Render dashboard to your Vercel URL, e.g. https://blastradius.vercel.app
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
